name: ActTrident CI & Production Readiness Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend Tests, Migrations & Security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acttrident
          POSTGRES_PASSWORD: test_ci_postgres_password_2026
          POSTGRES_DB: acttrident_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      LIVE_SEND_ENABLED: "false"
      SECRET_KEY: "ci-test-super-secret-key-at-least-32-chars-long"
      CREDENTIAL_ENCRYPTION_KEY: "ci-credential-encryption-key-16"
      DATABASE_URL: "postgresql+psycopg://acttrident:test_ci_postgres_password_2026@localhost:5432/acttrident_test_db"
      REDIS_URL: "redis://localhost:6379/0"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov anyio flake8

      - name: Linting and syntax check
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test Alembic Migrations (Upgrade -> Downgrade -> Upgrade)
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          cd ..

      - name: Execute Full Pytest Suite (Fail-Closed Simulation Mode)
        run: |
          python -m pytest backend/tests -v --durations=10

  frontend-verification:
    name: Frontend Build & TypeScript Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Compilation and Production Bundle Build
        working-directory: frontend
        run: npm run build

  docker-compose-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Development Compose Config
        run: docker compose -f docker-compose.dev.yml config

      - name: Validate Staging Compose Config
        run: docker compose -f docker-compose.staging.yml config

      - name: Validate Production Compose Config
        env:
          POSTGRES_PASSWORD: test_production_password_2026
          REDIS_PASSWORD: test_redis_password_2026
          SECRET_KEY: production_ci_test_secret_key_at_least_32_characters_long
          CREDENTIAL_ENCRYPTION_KEY: prod_ci_encryption_key_16
          BACKEND_CORS_ORIGINS: "https://app.acttrident.ai"
          META_WA_VERIFY_TOKEN: prod_ci_meta_token_secure_2026
          META_APP_SECRET: prod_ci_meta_app_secret_secure_2026
        run: docker compose -f docker-compose.prod.yml config
